<svg viewBox="0 0 400 600" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="600" fill="white"/>
  <text x="200" y="40" font-size="24" font-weight="bold" text-anchor="middle" fill="#333">Nomi</text>
  <text x="200" y="60" font-size="12" text-anchor="middle" fill="#999">Your stylist</text>

  <circle cx="370" cy="30" r="8" fill="none" stroke="#ddd" stroke-width="1"/>
  <line x1="365" y1="25" x2="375" y2="35" stroke="#ddd" stroke-width="1"/>

  <rect x="30" y="85" width="280" height="80" rx="12" fill="#f0f0f0"/>
  <text x="50" y="110" font-size="12" fill="#333">Hey — what do you need today? An outfit, a recommendation, or just tell me what you're working with.</text>

  <rect x="30" y="180" width="340" height="45" rx="8" fill="white" stroke="#ddd" stroke-width="1"/>
  <text x="50" y="208" font-size="12" text-anchor="start" fill="#666">What should I wear this week?</text>

  <rect x="30" y="240" width="340" height="45" rx="8" fill="white" stroke="#ddd" stroke-width="1"/>
  <text x="50" y="268" font-size="12" text-anchor="start" fill="#666">Help me shop on a budget</text>

  <rect x="30" y="300" width="340" height="45" rx="8" fill="white" stroke="#ddd" stroke-width="1"/>
  <text x="50" y="328" font-size="12" text-anchor="start" fill="#666">I have nothing to wear</text>

  <rect x="30" y="370" width="300" height="40" rx="8" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
  <text x="50" y="397" font-size="12" fill="#999">Message Nomi...</text>

  <circle cx="360" cy="390" r="18" fill="#f5f5f5"/>
  <polygon points="365,385 365,395 372,390" fill="#ddd"/>

  <rect x="0" y="550" width="100" height="50" fill="white" text-anchor="middle"/>
  <text x="50" y="575" font-size="12" text-anchor="middle" fill="#999">Home</text>

  <rect x="100" y="550" width="100" height="50" fill="white" text-anchor="middle"/>
  <text x="150" y="575" font-size="12" text-anchor="middle" fill="#999">Explore</text>

  <rect x="200" y="550" width="100" height="50" fill="white" text-anchor="middle"/>
  <text x="250" y="575" font-size="12" text-anchor="middle" fill="#999">Saved</text>

  <rect x="300" y="550" width="100" height="50" fill="white" text-anchor="middle"/>
  <text x="350" y="575" font-size="12" text-anchor="middle" fill="#c9a961">Ask</text>
</svg>