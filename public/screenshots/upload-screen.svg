<svg viewBox="0 0 400 600" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="600" fill="white"/>
  <text x="200" y="40" font-size="28" font-weight="bold" text-anchor="middle" fill="#333">nomi</text>
  <text x="200" y="65" font-size="12" text-anchor="middle" fill="#999">Find matching pieces from any store</text>

  <rect x="40" y="100" width="320" height="140" rx="12" fill="#f5f5f5" stroke="#ddd" stroke-width="2"/>
  <circle cx="200" cy="150" r="20" fill="#ccc"/>
  <text x="200" y="175" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Upload a photo of any piece</text>
  <text x="200" y="195" font-size="11" text-anchor="middle" fill="#999">JPG, PNG or HEIC - tap or drag</text>

  <text x="200" y="280" font-size="12" text-anchor="middle" fill="#999">or</text>

  <rect x="40" y="300" width="320" height="45" rx="8" fill="white" stroke="#ddd" stroke-width="1"/>
  <text x="60" y="330" font-size="13" fill="#999">Paste a product link</text>

  <rect x="40" y="370" width="150" height="60" rx="8" fill="white" stroke="#c9a961" stroke-width="2"/>
  <text x="115" y="397" font-size="13" font-weight="bold" text-anchor="middle" fill="#c9a961">Complete the outfit</text>
  <text x="115" y="415" font-size="10" text-anchor="middle" fill="#999">Find pieces that pair with this</text>

  <rect x="210" y="370" width="150" height="60" rx="8" fill="white" stroke="#ddd" stroke-width="1"/>
  <text x="285" y="397" font-size="13" font-weight="bold" text-anchor="middle" fill="#333">Find similar styles</text>
  <text x="285" y="415" font-size="10" text-anchor="middle" fill="#999">Find more like this, from other stores</text>

  <rect x="40" y="450" width="100" height="35" rx="6" fill="white" stroke="#ddd" stroke-width="1"/>
  <text x="90" y="472" font-size="11" text-anchor="middle" fill="#999">Filters</text>

  <rect x="0" y="550" width="100" height="50" fill="white" text-anchor="middle"/>
  <text x="50" y="575" font-size="12" text-anchor="middle" fill="#c9a961">Home</text>

  <rect x="100" y="550" width="100" height="50" fill="white" text-anchor="middle"/>
  <text x="150" y="575" font-size="12" text-anchor="middle" fill="#999">Explore</text>

  <rect x="200" y="550" width="100" height="50" fill="white" text-anchor="middle"/>
  <text x="250" y="575" font-size="12" text-anchor="middle" fill="#999">Saved</text>

  <rect x="300" y="550" width="100" height="50" fill="white" text-anchor="middle"/>
  <text x="350" y="575" font-size="12" text-anchor="middle" fill="#999">Ask</text>
</svg>