<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iOS Home with Nomi</title>
<style>
body { margin: 0; padding: 20px; background: #f0f0f0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; display: flex; justify-content: center; }
.screen { width: 390px; background: #f5f5f7; border-radius: 40px; padding: 12px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); overflow: hidden; }
.notch { height: 28px; background: #000; border-radius: 0 0 20px 20px; margin: -12px -12px 12px; }
.status { padding: 8px 16px; text-align: center; font-size: 12px; font-weight: 600; }
.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; padding: 16px; }
.app { text-align: center; }
.icon { width: 60px; height: 60px; margin: 0 auto 8px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 24px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
.label { font-size: 11px; font-weight: 500; color: #000; }
</style>
</head>
<body>
<div class="screen">
<div class="notch"></div>
<div class="status">1:09 📶 📡 🔋</div>
<div class="grid">

<!-- Row 1 -->
<div class="app"><div class="icon" style="background: conic-gradient(#ff6c70, #f7c64a, #68d393, #55aef1, #9a77e8, #ff6c70);">✦</div><div class="label">Photos</div></div>
<div class="app"><div class="icon" style="background: #555;">●</div><div class="label">Camera</div></div>
<div class="app"><div class="icon" style="background: #fff9e6; border: 1px solid #e8e0d0;">📝</div><div class="label">Notes</div></div>
<div class="app"><div class="icon" style="background: #ff3b30; color: #fff;">M</div><div class="label">Emails</div></div>

<!-- Row 2 -->
<div class="app"><div class="icon" style="background: #fff; border: 1px solid #ddd; font-size: 9px; font-weight: 700;"><div style="color: #ff3b30;">TUE</div><div style="font-size: 18px; color: #000;">8</div></div><div class="label">Calendar</div></div>
<div class="app"><div class="icon" style="background: #25d366; color: #fff;">💬</div><div class="label">WhatsApp</div></div>
<div class="app"><div class="icon" style="background: linear-gradient(135deg, #4ecdc4 0%, #ff6b6b 100%);">🗺</div><div class="label">Maps</div></div>
<div class="app"><div class="icon" style="background: #000;">🕐</div><div class="label">Clock</div></div>

<!-- Row 3 -->
<div class="app"><div class="icon" style="background: #666;">⚙️</div><div class="label">Settings</div></div>
<div class="app"><div class="icon" style="background: #007aff; color: #fff;">A</div><div class="label">App Store</div></div>
<div class="app"><div class="icon" style="background: #fff; border: 1px solid #ddd;">G</div><div class="label">Google</div></div>
<div class="app"><div class="icon" style="background: linear-gradient(135deg, #87ceeb 0%, #e0f6ff 100%);">⛅</div><div class="label">Weather</div></div>

<!-- Row 4 - NOMI -->
<div class="app"><div class="icon" style="background: linear-gradient(135deg, #d4af37 0%, #c9a96e 100%); color: #fff; font-size: 18px; font-weight: 300; letter-spacing: 0.3px;">nomi</div><div class="label">nomi</div></div>

</div>
</div>
</body>
</html>
