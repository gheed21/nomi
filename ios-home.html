<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iOS Home with Nomi</title>
<style>
body { margin: 0; padding: 0; background: #f5f5f7; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
.phone { width: 390px; height: 844px; background-image: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844"><rect fill="%23f5f5f7" width="390" height="844"/></svg>'); background-size: cover; position: relative; box-shadow: 0 20px 60px rgba(0,0,0,0.3); border-radius: 50px; overflow: hidden; }
.bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: url('https://images.unsplash.com/photo-1605559424843-9e4b3216ced3?w=390&h=844&fit=crop') center/cover no-repeat; opacity: 0.95; }
.nomi-app { position: absolute; bottom: 280px; right: 30px; text-align: center; cursor: pointer; transition: transform 0.2s; }
.nomi-app:active { transform: scale(0.95); }
.nomi-icon { width: 60px; height: 60px; background: linear-gradient(135deg, #d4af37 0%, #c9a96e 100%); border-radius: 14px; display: flex; align-items: center; justify-content: center; color: white; font-size: 18px; font-weight: 300; letter-spacing: 0.5px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); margin: 0 auto 8px; }
.nomi-label { font-size: 11px; font-weight: 500; color: #000; }
</style>
</head>
<body>
<div class="phone">
<div class="bg"></div>
<div class="nomi-app">
<div class="nomi-icon">nomi</div>
<div class="nomi-label">nomi</div>
</div>
</div>
</body>
</html>
